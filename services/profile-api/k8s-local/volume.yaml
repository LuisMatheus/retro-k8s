apiVersion: v1
kind: PersistentVolume
metadata:
  name: profile-api-local
spec:
  capacity:
    storage: 1Gi
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: retro-k8s
    name: profile-api-data
  hostPath:
    path: /mnt/retro-k8s-profiles
    type: Directory
