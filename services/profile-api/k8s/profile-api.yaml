apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: profile-api-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: profile-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: profile-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: profile-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: retro-k8s-poc/profile-api:pilot
          imagePullPolicy: Never
          env:
            - name: DATABASE_PATH
              value: /data/profiles.db
            - name: SECRET_KEY_BASE
              valueFrom:
                secretKeyRef:
                  name: profile-api-secret
                  key: SECRET_KEY_BASE
          ports:
            - name: http
              containerPort: 4000
          readinessProbe:
            httpGet:
              path: /api/profiles
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: profile-api-data
---
apiVersion: v1
kind: Service
metadata:
  name: profile-api
spec:
  selector:
    app.kubernetes.io/name: profile-api
  ports:
    - name: http
      port: 4000
      targetPort: http
