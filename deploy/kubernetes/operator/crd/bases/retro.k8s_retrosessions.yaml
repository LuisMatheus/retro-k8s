---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: retrosessions.retro.k8s
spec:
  group: retro.k8s
  names:
    kind: RetroSession
    listKind: RetroSessionList
    plural: retrosessions
    shortNames:
    - rs
    singular: retrosession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.console
      name: Console
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RetroSession is a request for one emulator session.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: RetroSessionSpec describes one emulator session.
            properties:
              allowedOrigins:
                description: |-
                  AllowedOrigins is a comma-separated WebSocket origin allowlist. An empty
                  value leaves the input agent's origin check disabled.
                type: string
              console:
                description: Console selects the libretro core. Supported values are
                  snes and gba.
                enum:
                - snes
                - gba
                type: string
              image:
                description: Image overrides the operator's default session image.
                type: string
              logLevel:
                description: LogLevel overrides the input agent log level.
                type: string
              minHoldMS:
                description: |-
                  MinHoldMS keeps short button taps held for at least this many
                  milliseconds. It defaults to the operator's configured value.
                format: int32
                minimum: 0
                type: integer
              padName:
                description: |-
                  PadName overrides the virtual gamepad name. It defaults to
                  "Retro-K8s Pad <session name>".
                type: string
              rom:
                description: |-
                  ROM is a path relative to the operator's read-only ROM library. It must
                  not be absolute and must not contain "." or ".." path segments.
                minLength: 1
                pattern: ^[^/].*$
                type: string
              saveClaimName:
                description: |-
                  SaveClaimName is an existing PersistentVolumeClaim in the session
                  namespace. The operator mounts it at /saves and never deletes it.
                minLength: 1
                type: string
              showFPS:
                description: ShowFPS enables RetroArch's on-stream frame counter.
                type: boolean
            required:
            - console
            - rom
            - saveClaimName
            type: object
          status:
            description: RetroSessionStatus reports the observed state of a session.
            properties:
              conditions:
                description: Conditions includes the standard Ready condition.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              deploymentName:
                description: DeploymentName is the emulator Deployment managed by
                  this session.
                type: string
              endpoints:
                description: Endpoints is the connection information for the frontend.
                properties:
                  inputPath:
                    description: InputPath is the WebSocket path exposed by the input
                      agent.
                    type: string
                  inputPort:
                    description: InputPort is the Service port for the input WebSocket.
                    format: int32
                    type: integer
                  inputService:
                    description: InputService is the Service name for the input WebSocket.
                    type: string
                  rtmpURL:
                    description: RTMPURL is the session Pod-local RTMP publish URL (not reachable from other Pods).
                    type: string
                  streamPath:
                    description: StreamPath is the MediaMTX path used for the RTMP
                      stream.
                    type: string
                  whepPath:
                    description: WHEPPath is the MediaMTX WebRTC playback path.
                    type: string
                type: object
              message:
                description: Message explains the current phase, including concrete
                  failures.
                type: string
              observedGeneration:
                description: ObservedGeneration is the last generation processed by
                  the operator.
                format: int64
                type: integer
              phase:
                description: Phase is Pending, Ready or Failed.
                type: string
              podName:
                description: PodName is the current emulator Pod, when one exists.
                type: string
              reason:
                description: Reason is a short machine-readable reason for the phase.
                type: string
              saveClaimName:
                description: SaveClaimName is the existing claim mounted at /saves.
                type: string
              serviceName:
                description: ServiceName is the input Service managed by this session.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
