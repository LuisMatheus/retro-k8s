apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: retro-k8s
resources:
  - namespace.yaml
  - frontend-rbac.yaml
  - frontend.yaml
  - mediamtx.yaml
configMapGenerator:
  - name: mediamtx-config
    files:
      - mediamtx.yml
  - name: platform-settings
    literals:
      - WEBRTC_HOST=127.0.0.1
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: retro-k8s-poc/frontend
    newTag: pilot
