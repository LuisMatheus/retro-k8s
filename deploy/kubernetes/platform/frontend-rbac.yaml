apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: retro-k8s
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frontend-retrosessions
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: retro-k8s
rules:
  - apiGroups:
      - retro.k8s
    resources:
      - retrosessions
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frontend-retrosessions
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: retro-k8s
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frontend-retrosessions
subjects:
  - kind: ServiceAccount
    name: frontend
