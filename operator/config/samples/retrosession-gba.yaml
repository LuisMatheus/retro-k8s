# GBA needs a library containing both console folders, for example:
#   ROM_DIR=$HOME/Documents/games bash k8s/snes/attach-node-input.sh detach
#   ROM_DIR=$HOME/Documents/games bash k8s/snes/attach-node-input.sh attach
# then the ROM path includes the console folder.
apiVersion: retro.k8s/v1alpha1
kind: RetroSession
metadata:
  name: pokemon-emerald
  namespace: retro-k8s
spec:
  console: gba
  rom: gba/Pokemon - Emerald Version (USA, Europe).gba
  saveClaimName: gba-saves
