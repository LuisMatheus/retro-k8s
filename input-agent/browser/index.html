<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retro-K8s test client</title>
<style>
  :root { --bg:#111; --fg:#eee; --mut:#999; --ok:#4c4; --bad:#e55; --warn:#ea3; --card:#1c1c1c; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f4f4; --fg:#111; --mut:#666; --card:#fff; }
  }
  body { margin:0; font:15px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  main { max-width:960px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 12px; }
  .tabs { display:flex; gap:8px; margin-bottom:12px; }
  button { font:inherit; padding:6px 14px; border:1px solid var(--mut); border-radius:6px;
           background:var(--card); color:var(--fg); cursor:pointer; }
  button.on { border-color:var(--ok); }
  video { width:100%; background:#000; aspect-ratio:4/3; image-rendering:pixelated; border-radius:8px; }
  .status { display:flex; gap:16px; flex-wrap:wrap; margin:10px 0; color:var(--mut); }
  .status b { color:var(--fg); }
  .ok { color:var(--ok) !important; } .bad { color:var(--bad) !important; } .warn { color:var(--warn) !important; }
  table { border-collapse:collapse; margin-top:8px; }
  td { padding:2px 14px 2px 0; color:var(--mut); }
  td:first-child { color:var(--fg); }
</style>
</head>
<body>
<main>
  <h1>Retro-K8s test client</h1>
  <div class="tabs" id="tabs">
    <button data-s="snes" class="on">SNES</button>
    <button data-s="gba">GBA</button>
    <button id="unmute">Unmute</button>
  </div>
  <video id="video" autoplay playsinline muted></video>
  <div class="status">
    <span>video: <b id="st-video">connecting</b></span>
    <span>input: <b id="st-input">connecting</b></span>
    <span>gamepad: <b id="st-pad">none (press a button on it)</b></span>
  </div>
  <table>
    <tr><td>Arrow keys</td><td>D-pad</td></tr>
    <tr><td>X / Z</td><td>south (RetroPad B) / east (RetroPad A)</td></tr>
    <tr><td>S / A</td><td>west (RetroPad Y) / north (RetroPad X)</td></tr>
    <tr><td>Enter / Right Shift</td><td>Start / Select</td></tr>
    <tr><td>Q / W</td><td>L / R</td></tr>
  </table>
</main>

<script type="module">
import { InputClient } from "./input-client.js";

const SESSIONS = { snes: { port: 8765 }, gba: { port: 8766 } };
const $ = (id) => document.getElementById(id);
const video = $("video");
let session = "snes", pc = null, client = null, videoGen = 0;

function setStatus(id, text, cls = "") {
  const el = $(id); el.textContent = text; el.className = cls;
}

// ---- Video: WebRTC WHEP from MediaMTX ----
async function startVideo() {
  const gen = ++videoGen;
  pc?.close();
  setStatus("st-video", "connecting", "warn");
  try {
    const peer = new RTCPeerConnection();
    const streamSession = session;
    pc = peer;
    peer.addTransceiver("video", { direction: "recvonly" });
    peer.addTransceiver("audio", { direction: "recvonly" });
    peer.ontrack = (e) => { video.srcObject = e.streams[0]; };
    peer.onconnectionstatechange = () => {
      if (gen !== videoGen) return;
      const s = peer.connectionState;
      setStatus("st-video", s, s === "connected" ? "ok" : s === "failed" ? "bad" : "warn");
      if (s === "failed" || s === "disconnected") setTimeout(() => gen === videoGen && startVideo(), 2000);
    };
    await peer.setLocalDescription(await peer.createOffer());
    await new Promise((res) => {
      if (peer.iceGatheringState === "complete") return res();
      peer.addEventListener("icegatheringstatechange", () => peer.iceGatheringState === "complete" && res());
      setTimeout(res, 2000);
    });
    if (gen !== videoGen) return;
    const r = await fetch(`http://${location.hostname}:8889/${streamSession}/whep`, {
      method: "POST", headers: { "Content-Type": "application/sdp" }, body: peer.localDescription.sdp,
    });
    if (!r.ok) throw new Error(`WHEP ${r.status}`);
    if (gen !== videoGen) return;
    await peer.setRemoteDescription({ type: "answer", sdp: await r.text() });
  } catch (err) {
    if (gen !== videoGen) return;
    setStatus("st-video", `${err.message} (retrying)`, "bad");
    setTimeout(() => gen === videoGen && startVideo(), 2000);
  }
}

// ---- Input: keyboard + gamepad -> WebSocket ----
function startInput() {
  client?.stop();
  const inputSession = session;
  const { port } = SESSIONS[inputSession];
  client = new InputClient({
    url: `ws://${location.hostname}:${port}/sessions/${inputSession}/input`,
    getToken: async () => {
      const response = await fetch(`/api/token?session=${inputSession}`);
      if (!response.ok) throw new Error(`Token ${response.status}`);
      return response.text();
    },
    onGamepad: (s) => setStatus("st-pad", s),
    onStatus: (s) => setStatus("st-input", s,
      s === "connected" ? "ok" : s === "another-controller-active" ? "bad" : "warn"),
  });
  client.start();
}

function selectSession(s) {
  session = s;
  document.querySelectorAll("#tabs [data-s]").forEach((b) => b.classList.toggle("on", b.dataset.s === s));
  startVideo();
  startInput();
}

$("tabs").addEventListener("click", (e) => {
  if (e.target.dataset.s) { selectSession(e.target.dataset.s); e.target.blur(); }
});
$("unmute").addEventListener("click", (e) => {
  video.muted = !video.muted; e.target.textContent = video.muted ? "Unmute" : "Mute"; e.target.blur();
});

selectSession("snes");
</script>
</body>
</html>
