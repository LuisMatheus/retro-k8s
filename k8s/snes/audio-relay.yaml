apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-relay
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: audio-relay
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audio-relay
        app.kubernetes.io/part-of: retro-k8s
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: retro-k8s-poc/frontend
          imagePullPolicy: Never
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                ffmpeg -nostdin -loglevel warning -i rtmp://mediamtx:1935/raw-snes \
                  -map 0:v:0 -map 0:a:0 -c:v copy -c:a libopus -ar 48000 -ac 2 \
                  -f rtsp -rtsp_transport tcp rtsp://mediamtx:8554/snes
                sleep 2
              done
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
