apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: retro-k8s
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: retro-k8s
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: retro-k8s-poc/frontend
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: INPUT_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: retro-session-secret
                  key: INPUT_TOKEN_SECRET
            - name: SESSIONS
              value: snes
            - name: DEV_HOST
              value: 0.0.0.0
            - name: DEV_PORT
              value: "8000"
            - name: MEDIA_PORT
              value: "18889"
            - name: SNES_INPUT_PORT
              value: "18765"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: retro-k8s
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8000
      targetPort: http
