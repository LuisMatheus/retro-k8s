apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: retro-k8s

resources:
  - namespace.yaml
  - mediamtx.yaml
  - frontend.yaml
  - audio-relay.yaml
  - saves-pvc.yaml
  - snes.yaml

configMapGenerator:
  - name: mediamtx-config
    files:
      - mediamtx.yml
  - name: snes-session
    envs:
      - generated/session.env

secretGenerator:
  - name: retro-session-secret
    envs:
      - generated/secret.env

# Keep the names stable because Deployments reference them by name.
generatorOptions:
  disableNameSuffixHash: true

images:
  - name: retro-k8s-poc/retroarch-input
    newTag: pilot
  - name: retro-k8s-poc/frontend
    newTag: pilot

patches:
  - path: generated/security-context.yaml
